name: CI Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
  schedule:
    # Nightly race sweep for the mesh package: ~5-7x slower than the plain
    # run, so it stays off the per-push critical path (see the race-fast
    # job for what DOES run on every push). 03:45 UTC, low CI-traffic hour.
    - cron: "45 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Setup Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Setup .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "6.0.x"

      - name: Setup Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run full test suite
        run: go test ./... -count=1 -timeout 1800s

  race-fast:
    name: Race (fast packages)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The fast leaf packages (gossip, transport, crypto, bootstrap, nat)
      # race in well under a minute combined, so they run under -race on
      # every push. The mesh package is deliberately NOT here: its suite
      # takes minutes even without -race and roughly triples under it,
      # which would dominate every push — the nightly mesh-race job below
      # covers it instead.
      - name: Run fast packages under the race detector
        run: go test -race -count=1 -timeout 900s ./internal/gossip ./internal/transport ./internal/crypto ./internal/bootstrap ./internal/nat

  mesh-strict:
    name: Mesh Strict (count=1)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # count=1 by design: a single run, no retries, so any flaky mesh test
      # FAILS this job and stays visible. Re-running the package with
      # -count=3 used to mask exactly the flakes this workflow exists to
      # catch: a test that passes 2 of 3 runs is green here, and the
      # regression ships. The soak job below is where repetition belongs —
      # it hunts nondeterminism that survives a deterministic pass.
      - name: Run mesh package once, strictly
        run: go test ./internal/mesh -count=1 -timeout 1800s

  mesh-soak:
    name: Mesh Soak (repeat)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The soak deliberately repeats the mesh package: repetition exposes
      # cross-run state leaks, port reuse races, and timer-boundary bugs that
      # one pass cannot see. It complements the strict job (which must stay
      # count=1 so flakes stay red); it is NOT a retry mechanism, and a
      # failure here is investigated, never re-rolled.
      - name: Re-run mesh package under repetition
        run: go test ./internal/mesh -count=3 -timeout 1800s

  load-soak:
    name: Load Soak (25 nodes, sustained)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Sustained-load gate, distinct from mesh-soak (whole-package
      # repetition): this drives ONLY the multi-node load/topology
      # scenarios but with repetition, catching convergence and
      # connectivity degradation under sustained publish churn that a
      # single short pass cannot see. Runs on push like the rest of the
      # mesh gates because these tests take seconds each, not minutes.
      - name: Load topology scenarios under repetition
        run: go test ./internal/mesh -count=3 -timeout 1800s -run 'TestTwentyFiveNodePublishBurstPropagatesToAllSubscribers|TestRelayBurstDeliveryRemainsStable|TestMixedTopologyPubSubAndRelayRemainStable|TestMixedTopologySteadyStateSoakRetainsConnectivity|TestTwelveNodeStarSustainsRotatingPublishers|TestStarTopologyResumesDeliveryAfterLeafRestart|TestStarTopologyRecoversAfterPeerReplacement'

  memory-gate:
    name: Memory Gate (steady-state heap)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Steady-state heap regression gate: the 201-node memory benchmark
      # FAILS when heap_mb exceeds the baseline (see
      # internal/mesh/memory_benchmark_test.go) by more than 20%. Set
      # MOSS_HEAP_BASELINE_MB here to re-anchor the baseline after an
      # intentional footprint change; never widen the allowed growth to
      # make a regression pass.
      - name: Run steady-state memory benchmark with heap budget
        run: go test ./internal/mesh -run '^$' -bench 'BenchmarkTwoHundredPeerSteadyStateMemory' -benchtime=1x -timeout 900s

  mesh-race:
    name: Mesh Race (nightly)
    # Nightly only (see `schedule` above): the mesh suite under -race takes
    # several times longer than the plain strict run and must not slow the
    # per-push path. Also runs when triggered manually.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run mesh package under the race detector
        run: go test -race -count=1 -timeout 3600s ./internal/mesh
