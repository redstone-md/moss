<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moss explorer → MossScope</title>
  <!--
    The explorer is now MossScope, served at /scope.html and at scope.moss.surf.

    This page stays as a redirect rather than being deleted: the old URL is in
    the docs, in the README and in whatever people bookmarked, and a 404 for a
    link that used to work costs more than one small file. The query string is
    carried over so ?gateways=… keeps meaning what it meant.

    canonical + refresh handle crawlers and no-JS; the script handles everyone
    else instantly and uses replace() so Back does not bounce them here again.
  -->
  <!-- Absolute on purpose: a relative href here is treated as an asset by the
       bundler and rewritten to a hashed filename, which points crawlers at a
       copy instead of at the page. -->
  <link rel="canonical" href="https://scope.moss.surf/" />
  <meta http-equiv="refresh" content="0; url=/scope.html" />
  <link rel="icon" href="/favicon.svg" />
  <style>
    body {
      margin: 0; display: grid; place-content: center; min-height: 100vh; gap: 10px;
      background: #0b1012; color: #d5e1e3; text-align: center;
      font: 13px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    a { color: #35c08a; }
    p { color: #7b8e93; max-width: 46ch; margin: 0 auto; }
  </style>
</head>
<body>
  <p>The explorer moved to <a href="/scope.html">MossScope</a>.</p>
  <p>Same network view, plus a debugger for your own node when one is running.</p>
  <script>
    const to = new URL("/scope.html", location.origin);
    for (const [k, v] of new URLSearchParams(location.search)) {
      // `gateways` was the explorer's name for what MossScope calls `scopes`.
      to.searchParams.set(k === "gateways" ? "scopes" : k, v);
    }
    location.replace(to.toString());
  </script>
</body>
</html>
